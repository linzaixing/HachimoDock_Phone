name: Release HachimoDock_Phone

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 34 SDK & build-tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMGR="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Lite & Full Release APKs (R8 minified + signed)
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          cd android
          ./gradlew :hachimo:assembleLiteRelease :hachimo:assembleFullRelease --no-daemon

      - name: Verify 16KB page alignment & signatures on both APKs
        run: |
          for APK in \
            android/hachimo/build/outputs/apk/lite/release/hachimo-lite-release.apk \
            android/hachimo/build/outputs/apk/full/release/hachimo-full-release.apk; do
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          done
          python3 - <<'EOF'
          import zipfile, struct
          apks = [
              "android/hachimo/build/outputs/apk/lite/release/hachimo-lite-release.apk",
              "android/hachimo/build/outputs/apk/full/release/hachimo-full-release.apk",
          ]
          for apk in apks:
              with zipfile.ZipFile(apk) as z, open(apk, "rb") as fp:
                  for info in z.infolist():
                      if not info.filename.endswith(".so"):
                          continue
                      fp.seek(info.header_offset + 26)
                      fn_len, ex_len = struct.unpack("<HH", fp.read(4))
                      off = info.header_offset + 30 + fn_len + ex_len
                      assert info.compress_type == 0 and off % 16384 == 0, (apk, info.filename, info.compress_type, off % 16384)
              print("Verified 16KB ZIP-aligned:", apk)
          EOF

      - name: Package release artifacts
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p release_dist
          cp android/hachimo/build/outputs/apk/lite/release/hachimo-lite-release.apk "release_dist/HachimoPhone-${TAG_NAME}-lite.apk"
          cp android/hachimo/build/outputs/apk/full/release/hachimo-full-release.apk "release_dist/HachimoPhone-${TAG_NAME}-full.apk"
          zip -r "release_dist/HachimoDock_Phone-PC-Bridge-${TAG_NAME}.zip" bridge esp32 .trae README.md \
            -x "bridge/token.txt" "bridge/config.json" "bridge/*.lnk" "esp32/**/.pio/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          {
            echo "## HachimoDock_Phone ${TAG_NAME}"
            echo ""
            echo "### 安装包选择（R8 优化压缩，均支持 Android 7.0+ / arm64-v8a 与 Android 16 16KB 页对齐）"
            echo "- **推荐 · 轻量版 \`HachimoPhone-${TAG_NAME}-lite.apk\`**：包含端侧 FP16 KWS 唤醒、离线童声、免费/付费语音对话、智谱 VLM 语义看图、系统人脸云台追踪、PC Bridge 与 USB 串口控制；不含 ML Kit/重复 ONNX Runtime，体积大幅精简。"
            echo "- **全功能版 \`HachimoPhone-${TAG_NAME}-full.apk\`**：在轻量版基础上额外内置离线 ML Kit 骨架/标签/人脸检测与 ArcFace 家人记忆。"
            echo "- **PC Bridge & ESP32 云台（可选）**：下载 \`HachimoDock_Phone-PC-Bridge-${TAG_NAME}.zip\`，PC 端运行 \`node bridge/start-all.mjs\` 即可联动 Claude Code / Codex / Trae。"
          } > release_dist/NOTES.md
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release_dist/*.apk release_dist/*.zip --clobber
          else
            gh release create "${TAG_NAME}" release_dist/*.apk release_dist/*.zip \
              --title "HachimoDock_Phone ${TAG_NAME}" \
              --notes-file release_dist/NOTES.md
          fi
