name: Release HachimoDock_Phone

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 34 SDK & build-tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMGR="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK (R8 minified + signed)
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          cd android
          ./gradlew :hachimo:assembleRelease --no-daemon

      - name: Verify 16KB page alignment & signature on APK
        run: |
          APK="android/hachimo/build/outputs/apk/release/hachimo-release.apk"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          python3 - <<'EOF'
          import zipfile, struct
          apk = "android/hachimo/build/outputs/apk/release/hachimo-release.apk"
          with zipfile.ZipFile(apk) as z, open(apk, "rb") as fp:
              for info in z.infolist():
                  if not info.filename.endswith(".so"):
                      continue
                  fp.seek(info.header_offset + 26)
                  fn_len, ex_len = struct.unpack("<HH", fp.read(4))
                  off = info.header_offset + 30 + fn_len + ex_len
                  assert info.compress_type == 0 and off % 16384 == 0, (apk, info.filename, info.compress_type, off % 16384)
          print("Verified 16KB ZIP-aligned:", apk)
          EOF

      - name: Package release artifacts
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p release_dist
          cp android/hachimo/build/outputs/apk/release/hachimo-release.apk "release_dist/HachimoPhone-${TAG_NAME}-lite.apk"
          zip -r "release_dist/HachimoDock_Phone-PC-Bridge-${TAG_NAME}.zip" bridge esp32 .trae README.md \
            -x "bridge/token.txt" "bridge/config.json" "bridge/*.lnk" "esp32/**/.pio/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          {
            echo "## HachimoDock_Phone ${TAG_NAME}"
            echo ""
            echo "### 安装说明（R8 优化压缩，支持 Android 7.0+ / arm64-v8a 与 Android 16 16KB 页对齐）"
            echo "- **手机端 \`HachimoPhone-${TAG_NAME}-lite.apk\`**：内置端侧 FP16 KWS 唤醒、离线童声、智谱+阿里长期免费方案 / 阿里云 1 Key 付费方案、智谱 VLM 语义看图、系统人脸云台追踪、PC Bridge 与 USB 串口控制。"
            echo "- **PC Bridge & ESP32 云台（可选）**：下载 \`HachimoDock_Phone-PC-Bridge-${TAG_NAME}.zip\`，PC 端运行 \`node bridge/start-all.mjs\` 即可联动 Claude Code / Codex / Trae。"
          } > release_dist/NOTES.md
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release_dist/*.apk release_dist/*.zip --clobber
          else
            gh release create "${TAG_NAME}" release_dist/*.apk release_dist/*.zip \
              --title "HachimoDock_Phone ${TAG_NAME}" \
              --notes-file release_dist/NOTES.md
          fi
