plugins { id 'com.android.application' }

android {
    namespace 'com.example.hachimophone'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hachimophone"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.0.2-lite"
        // 只保留 arm64：四个 ABI 会白白撑大 APK
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 开源直装签名：未配独立签名证书时用 debug keystore 签名，让 Release APK 也可直接安装
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // 确保 .so 以未压缩方式按 16 KB 页边界打包对齐，兼容 Android 15/16
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // CameraX 会带进 kotlin-stdlib，用 BOM 对齐，避免重复类
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // 轻量纯 Java 的 WebSocket 客户端，不拉 kotlin-stdlib，离线缓存也能构建
    implementation 'com.squareup.okhttp3:okhttp:3.9.1'
    implementation 'androidx.core:core:1.13.1'

    // 相机按需拍照看图与云台人脸追踪
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // 人脸检测统一用 ML Kit 捆绑模型：各机型同一套模型，不受厂商内置检测差异影响
    implementation 'com.google.mlkit:face-detection:16.1.7'
    // 人脸丢失时用 2.9MB 的量化 MoveNet 做人体姿态兜底，比 ML Kit 姿态省约 23MB
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // MoveNet 优先走 GPU delegate，失败自动回退 CPU
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'

    // ESP32-C3 走 Type-C OTG 的 USB CDC 串口
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'

    // 纯 Java Opus 编解码（用于小智 WebSocket 协议，零原生 .so 体积与 16KB 对齐风险）
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
}
